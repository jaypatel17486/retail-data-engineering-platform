

services:

  postgres:
    image: postgres:16
    container_name: fluxguard_postgres
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fluxguard

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres:5432/fluxguard
      AIRFLOW__WEBSERVER__SECRET_KEY: my-super-secret-airflow-key
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"

      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fluxguard
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432

      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: fluxguard
      DB_USER: postgres
      DB_PASSWORD: postgres

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./:/opt/airflow/project

    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --username airflow
      --firstname Admin
      --lastname User
      --role Admin
      --email admin@example.com
      --password airflow || true
      "

  airflow-webserver:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile

    restart: always

    depends_on:
      - airflow-init

    ports:
      - "8080:8080"

    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres:5432/fluxguard
      AIRFLOW__WEBSERVER__SECRET_KEY: my-super-secret-airflow-key
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      PYTHONPATH: /opt/airflow

      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fluxguard
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432

      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: fluxguard
      DB_USER: postgres
      DB_PASSWORD: postgres


    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./:/opt/airflow/project
      - ./warehouse:/opt/airflow/warehouse

    command: airflow webserver

  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile

    restart: always

    depends_on:
      - airflow-webserver

    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres:5432/airflow
      AIRFLOW__WEBSERVER__SECRET_KEY: my-super-secret-airflow-key
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      PYTHONPATH: /opt/airflow

      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fluxguard
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432

      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: fluxguard
      DB_USER: postgres
      DB_PASSWORD: postgres


    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./:/opt/airflow/project
      - ./warehouse:/opt/airflow/warehouse

    command: airflow scheduler

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    restart: always

    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    restart: always

    depends_on:
      - zookeeper

    ports:
      - "9092:9092"

    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    
  spark-master:
    image: apache/spark:3.5.6

    container_name: spark-master

    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master

    ports:
      - "7077:7077"
      - "8081:8080"

  spark-worker:
    image: apache/spark:3.5.6

    container_name: spark-worker

    depends_on:
      - spark-master

    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077

    ports:
      - "8082:8081"

volumes:
  postgres_data: