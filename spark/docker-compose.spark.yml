services:

  spark-master:
    image: apache/spark:3.5.2

    container_name: spark-master

    hostname: spark-master

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master

    ports:
      - "7077:7077"
      - "8081:8080"

    networks:
      spark_net:
        aliases:
          - spark-master
      retail-data-engineering-platform_default:
        aliases:
          - spark-master

    volumes:
      - ./jobs:/opt/spark/jobs


  spark-worker:
    image: apache/spark:3.5.2

    container_name: spark-worker

    hostname: spark-worker

    depends_on:
      - spark-master

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077

    networks:
      spark_net:
        aliases:
          - spark-worker
      retail-data-engineering-platform_default:
        aliases:
          - spark-worker

    volumes:
      - ./jobs:/opt/spark/jobs


networks:

  spark_net:

  retail-data-engineering-platform_default:
    external: true